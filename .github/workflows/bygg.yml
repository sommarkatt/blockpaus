      - name: Skapa signeringsnyckel första gången
        run: |
          if [ ! -f keystore/blockpaus.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/blockpaus.jks -alias blockpaus \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass blockpaus123 -keypass blockpaus123 -dname "CN=Blockpaus"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keystore/blockpaus.jks
            git commit -m "Signeringsnyckel för Blockpaus"
            git push
          fi

      - name: Bygg apk
        run: |
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Blockpaus.apk

      - name: Lägg ut under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Blockpaus version ${{ github.run_number }}
          body: Tryck på Blockpaus.apk nedan för att ladda ner.
          files: Blockpaus.apk
          make_latest: true
